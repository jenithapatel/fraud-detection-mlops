global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraud-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Drift share pushed by the Evidently report job. honor_labels keeps the job label
  # the report set instead of overwriting it with "pushgateway".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
