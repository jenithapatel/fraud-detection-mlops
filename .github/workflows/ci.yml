name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits for AI attribution
        run: sh scripts/check_attribution.sh origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }}
      - name: Check PR description for AI attribution
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -iqE 'generated with \[?claude|co-authored-by:.*claude|claude\.ai/code'; then
            echo "Remove the Claude attribution line from the PR description."; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t fraud-api:ci .
