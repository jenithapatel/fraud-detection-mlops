# Local stack: MLflow tracking server + inference API + Prometheus + Grafana.
#   docker compose up -d --build
# MLflow UI http://localhost:5000 | API docs http://localhost:8000/docs
# Prometheus http://localhost:9090 | Grafana http://localhost:3000 (admin/admin)
services:
  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install --no-cache-dir 'mlflow>=3,<4' &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts '*'"
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FRAUD_MODEL_SOURCE: ${FRAUD_MODEL_SOURCE:-registry}
    ports: ["8000:8000"]
    volumes: [./data/predictions:/app/data/predictions]
    depends_on: [mlflow]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mlflow-data:
